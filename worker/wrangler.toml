name = "status-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
API_KEY = "change-me-to-a-secret-key"

[[kv_namespaces]]
binding = "STATUS_KV"
id = "PLACEHOLDER_KV_ID"
# After creating the KV namespace with `wrangler kv namespace create STATUS_KV`,
# replace PLACEHOLDER_KV_ID with the actual ID.
