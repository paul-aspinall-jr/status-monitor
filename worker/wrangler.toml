name = "status-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
API_KEY = "change-me-to-a-secret-key"

[[d1_databases]]
binding = "DB"
database_name = "status-monitor-db"
database_id = "PLACEHOLDER_DB_ID"
# After creating the D1 database with `npx wrangler d1 create status-monitor-db`,
# replace PLACEHOLDER_DB_ID with the actual ID.
